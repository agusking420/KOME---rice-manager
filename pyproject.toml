[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kome"
version = "0.1.0"
description = "🍚 Rice manager for Linux — switch desktop themes using symlinks"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
authors = [
    { name = "agusdev" },
]
keywords = ["linux", "rice", "dotfiles", "symlinks", "desktop-customization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.scripts]
kome = "kome.cli:main"

[project.urls]
Homepage = "https://github.com/agusdev/kome"
Repository = "https://github.com/agusdev/kome"
Issues = "https://github.com/agusdev/kome/issues"

[tool.setuptools.packages.find]
include = ["kome*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
